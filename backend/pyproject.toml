[project]
name = "zeichen-backend"
version = "0.1.0"
description = "贼船 Zeichen — 业务后端(API 与 MCP 共享 service 层)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.3",
    "pwdlib[argon2]>=0.3",
    "pyjwt>=2.13",
    "cryptography>=44",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-q"

[tool.setuptools]
packages = ["app", "app.models", "app.tests"]
