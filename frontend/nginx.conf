# 贼船 Zeichen — nginx 唯一入口(规格书 §8.1)。
# 静态 SPA + /api → api 容器,/mcp → mcp 容器(streamable HTTP,SSE 必须关缓冲)。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # 附件单文件上限 20MB(backend ATTACHMENT_MAX_FILE_BYTES),留余量
    client_max_body_size 25m;

    # API(JSON 响应)
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP streamable HTTP:POST 响应走 SSE,必须逐块转发。
    # Host 必须带端口(MCP 的 DNS-rebinding 白名单按 host:port 模式匹配)。
    location /mcp {
        proxy_pass http://mcp:8000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
