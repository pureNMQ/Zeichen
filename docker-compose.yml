# 贼船 Zeichen — 本地全链路编排(规格书 §1.1 / §8)。
# `docker compose up -d` 一键可起:nginx 唯一入口,api/mcp/worker 不发布宿主端口。
# 宿主直连的旧开发模式(start-all.ps1)仍依赖 postgres:5432 与 cognee:8000 的宿主发布。
name: zeichen

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zeichen
      POSTGRES_PASSWORD: zeichen
      POSTGRES_DB: zeichen
    ports:
      # 仅开发期暴露给宿主(start-all.ps1 直连);生产不发布宿主端口(§8.1)
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeichen -d zeichen"]
      interval: 5s
      timeout: 3s
      retries: 10

  cognee:
    build:
      context: .
      dockerfile: Dockerfile.cognee
    image: zeichen-cognee:1.4.1-fastembed
    # Managed configuration is generated by Zeichen into this ignored runtime
    # file immediately before a controlled recreate.  It is optional so fresh
    # developer checkouts retain the safe defaults below until first managed use.
    env_file:
      - path: .scratch/cognee-runtime.env
        required: false
    environment:
      ENABLE_BACKEND_ACCESS_CONTROL: "True"          # §8.2 cognee 默认安全项,显式确认
      DATA_ROOT_DIRECTORY: /app/data
      SYSTEM_ROOT_DIRECTORY: /app/system
      # DeepSeek uses cognee's OpenAI-compatible custom provider. Keep the
      # secret exclusively in the ignored root .env file.
      LLM_PROVIDER: ${LLM_PROVIDER-custom}
      # `deepseek-v4-flash` is DeepSeek's official model ID. Cognee sends it
      # through LiteLLM, which needs this provider-qualified form.
      LLM_MODEL: ${LLM_MODEL-deepseek/deepseek-v4-flash}
      LLM_ENDPOINT: ${LLM_ENDPOINT-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY-${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY in the root .env file}}
      # Avoid requiring a second cloud credential for embeddings. The first
      # write downloads this small model into the cognee volume.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS-384}
      # 受限网络下禁止向 huggingface.co 在线检查/下载(模型已在 cognee_fastembed_cache 卷)
      HF_HUB_OFFLINE: "1"
      FASTEMBED_CACHE_PATH: /tmp/fastembed_cache
    volumes:
      - cognee_data:/app/data
      - cognee_system:/app/system
      # fastembed/HF 模型缓存不落在 DATA_ROOT 内,容器重建会重下(且受限网络下
      # 下载不稳定),持久化到命名卷:
      - cognee_hf_cache:/root/.cache/huggingface
      - cognee_fastembed_cache:/tmp/fastembed_cache
      # cognee 1.4.1 的 Kuzu/ladybug 图库首次 recall 需从 extension.ladybugdb.com
      # 下载 json 扩展;受限网络下把预下载的扩展挂载进去(本地工作区缓存,
      # 见 .gitignore 的 backend/.lbdb-extension;网络可达的环境可删掉本行)。
      - ./backend/.lbdb-extension:/root/.lbdb/extension
    ports:
      # 仅开发期暴露给宿主(start-all.ps1 直连);全容器模式下 api/mcp 走内部网络
      - "8000:8000"

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://zeichen:zeichen@postgres:5432/zeichen
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-0123456789abcdef}
      SESSION_COOKIE_SECURE: "false"
      WEB_BASE_URL: http://localhost
      COGNEE_BASE_URL: http://cognee:8000/api/v1
      COGNEE_SERVICE_EMAIL: ${COGNEE_SERVICE_EMAIL:-zeichen-service@example.com}
      COGNEE_SERVICE_PASSWORD: ${COGNEE_SERVICE_PASSWORD:-zeichen-local-cognee-service-password}
      ATTACHMENT_STORAGE_DIR: storage/attachments
    volumes:
      - attachments:/srv/zeichen/storage/attachments
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      cognee:
        condition: service_started
    # 不发布宿主端口(§8.1);调试可临时取消注释:ports: ["8001:8000"]

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    restart: unless-stopped
    command: ["uvicorn", "app.mcp_server.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://zeichen:zeichen@postgres:5432/zeichen
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-0123456789abcdef}
      COGNEE_BASE_URL: http://cognee:8000/api/v1
      COGNEE_SERVICE_EMAIL: ${COGNEE_SERVICE_EMAIL:-zeichen-service@example.com}
      COGNEE_SERVICE_PASSWORD: ${COGNEE_SERVICE_PASSWORD:-zeichen-local-cognee-service-password}
      ATTACHMENT_STORAGE_DIR: storage/attachments
    volumes:
      - attachments:/srv/zeichen/storage/attachments
    depends_on:
      postgres:
        condition: service_healthy
    # 不发布宿主端口(§8.1);MCP 经 nginx /mcp 访问

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    restart: unless-stopped
    command: ["python", "-m", "app.workers.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://zeichen:zeichen@postgres:5432/zeichen
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-0123456789abcdef}
      COGNEE_BASE_URL: http://cognee:8000/api/v1
      COGNEE_SERVICE_EMAIL: ${COGNEE_SERVICE_EMAIL:-zeichen-service@example.com}
      COGNEE_SERVICE_PASSWORD: ${COGNEE_SERVICE_PASSWORD:-zeichen-local-cognee-service-password}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  # Cognee 重启 worker:持久消费 cognee_restart_job 队列,消除「永久排队」。
  # 经只读 docker.sock 以服务端固定 argv 调 docker compose 重建 cognee 容器
  # (最小权限:全仓仅本服务持有 docker.sock,且镜像内无 daemon)。
  restart-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    restart: unless-stopped
    command: ["python", "-m", "app.workers.cognee_restart"]
    environment:
      DATABASE_URL: postgresql+psycopg://zeichen:zeichen@postgres:5432/zeichen
      # 与 api 相同的会话密钥:解密受管 LLM 密钥写入 runtime env 必须一致
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-0123456789abcdef}
      COGNEE_BASE_URL: http://cognee:8000/api/v1
      COGNEE_SERVICE_EMAIL: ${COGNEE_SERVICE_EMAIL:-zeichen-service@example.com}
      COGNEE_SERVICE_PASSWORD: ${COGNEE_SERVICE_PASSWORD:-zeichen-local-cognee-service-password}
      # 容器内固定路径:compose 项目目录与受管 runtime env(写入 .scratch 后
      # 以 --env-file 传入 docker compose)
      COGNEE_COMPOSE_PROJECT_DIR: /srv/zeichen
      COGNEE_RUNTIME_ENV_FILE: /srv/zeichen/.scratch/cognee-runtime.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # compose 项目文件与受管 env(.scratch 可写:重建前先写入 runtime env)
      - ./docker-compose.yml:/srv/zeichen/docker-compose.yml:ro
      - ./.env:/srv/zeichen/.env:ro
      - ./.scratch:/srv/zeichen/.scratch
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
      - mcp

volumes:
  pgdata:
  cognee_data:
  cognee_system:
  cognee_hf_cache:
  cognee_fastembed_cache:
  attachments:
