# 贼船 Zeichen — 本地开发编排骨架(规格书 §1.1 / §8)
# 本文件是骨架:目前 postgres + cognee 可直接起;api / mcp / web 容器在后续票落地。
# 生产布局(nginx 唯一入口)见规格书 §8.1,在部署票中完善。
name: zeichen

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zeichen
      POSTGRES_PASSWORD: zeichen
      POSTGRES_DB: zeichen
    ports:
      # 仅开发期暴露给宿主(backend 本地进程连接);生产不发布宿主端口(§8.1)
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeichen -d zeichen"]
      interval: 5s
      timeout: 3s
      retries: 10

  cognee:
    build:
      context: .
      dockerfile: Dockerfile.cognee
    image: zeichen-cognee:1.4.1-fastembed
    environment:
      ENABLE_BACKEND_ACCESS_CONTROL: "True"          # §8.2 cognee 默认安全项,显式确认
      DATA_ROOT_DIRECTORY: /app/data
      SYSTEM_ROOT_DIRECTORY: /app/system
      # DeepSeek uses cognee's OpenAI-compatible custom provider. Keep the
      # secret exclusively in the ignored root .env file.
      LLM_PROVIDER: custom
      # `deepseek-v4-flash` is DeepSeek's official model ID. Cognee sends it
      # through LiteLLM, which needs this provider-qualified form.
      LLM_MODEL: deepseek/deepseek-v4-flash
      LLM_ENDPOINT: https://api.deepseek.com
      LLM_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY in the root .env file}
      # Avoid requiring a second cloud credential for embeddings. The first
      # write downloads this small model into the cognee volume.
      EMBEDDING_PROVIDER: fastembed
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      EMBEDDING_DIMENSIONS: "384"
    volumes:
      - cognee_data:/app/data
      - cognee_system:/app/system
    ports:
      - "8000:8000"

  # --- 以下容器在后续票落地(骨架占位,勿启用) ---
  # api:
  #   build: ./backend
  #   depends_on: [postgres]
  # mcp:
  #   build: ./backend
  #   environment:
  #     TRANSPORT_MODE: http
  # web:
  #   build: ./frontend

volumes:
  pgdata:
  cognee_data:
  cognee_system:
