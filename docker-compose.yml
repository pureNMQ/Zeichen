# 贼船 Zeichen — 本地全链路编排(规格书 §1.1 / §8)。
# `docker compose up -d` 一键可起:nginx 唯一入口，默认启动 web、api、mcp 和 postgres。
# 宿主直连的旧开发模式(start-all.ps1)仍依赖 postgres:5432 的宿主发布。
name: zeichen

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zeichen
      POSTGRES_PASSWORD: zeichen
      POSTGRES_DB: zeichen
    ports:
      # 仅开发期暴露给宿主(start-all.ps1 直连);生产不发布宿主端口(§8.1)
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeichen -d zeichen"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://zeichen:zeichen@postgres:5432/zeichen
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-0123456789abcdef}
      SESSION_COOKIE_SECURE: "false"
      WEB_BASE_URL: http://localhost
      ATTACHMENT_STORAGE_DIR: storage/attachments
    volumes:
      - attachments:/srv/zeichen/storage/attachments
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    # 不发布宿主端口(§8.1);调试可临时取消注释:ports: ["8001:8000"]

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    restart: unless-stopped
    command: ["uvicorn", "app.mcp_server.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://zeichen:zeichen@postgres:5432/zeichen
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-0123456789abcdef}
      ATTACHMENT_STORAGE_DIR: storage/attachments
    volumes:
      - attachments:/srv/zeichen/storage/attachments
    depends_on:
      postgres:
        condition: service_healthy
    # 不发布宿主端口(§8.1);MCP 经 nginx /mcp 访问

  worker:
    profiles: ["legacy-only"]
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    restart: unless-stopped
    command: ["python", "-m", "app.workers.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://zeichen:zeichen@postgres:5432/zeichen
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-0123456789abcdef}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
      - mcp

volumes:
  pgdata:
  attachments:
