# 贼船 Zeichen — 生产 nginx(唯一公网入口,TLS 终止;规格书 §8.1)。
# 由 docker-compose.prod.yml 挂载进 web 容器替换默认配置。
# 证书:仓库根 certs/fullchain.pem + certs/privkey.pem(云厂商免费证书 PEM 或 certbot)。
# 首部署步骤见 deploy/docs/first-deploy.md,续期见 deploy/docs/ops.md §4。

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # 附件单文件上限 20MB(backend ATTACHMENT_MAX_FILE_BYTES),留余量
    client_max_body_size 25m;

    # API(JSON 响应)
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP streamable HTTP:POST 响应走 SSE,必须逐块转发。
    # Host 必须带端口(MCP 的 DNS-rebinding 白名单按 host:port 模式匹配,
    # .env 的 MCP_ALLOWED_HOSTS 需含 <域名>:443)。
    location /mcp {
        proxy_pass http://mcp:8000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # certbot webroot 续期(手动证书不需要;目录未挂载时此路径 404 无副作用)
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
