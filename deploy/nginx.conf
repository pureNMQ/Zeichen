# mochigm.cn 双站入口
#   mochigm.cn / www.mochigm.cn  -> 个人站(静态,Vite 产物 /usr/share/nginx/mochi)
#   zeichen.mochigm.cn           -> 贼船 Zeichen(/api/ /mcp 反代 + SPA)
# 由 zeichen-web 容器承载:TLS 终止、唯一公网入口。
# 证书:/etc/nginx/certs/fullchain.pem + privkey.pem(需含三个域名)

# ---------- HTTP:ACME 验证 + 本地 agent 直连,其余跳 HTTPS ----------
server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 本地 agent 插件(如 DSH 的 http://127.0.0.1/mcp)不走 TLS,301 会中断流式会话
    location /mcp {
        proxy_pass http://mcp:8000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # certbot HTTP-01,必须写在 location / 之前
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 个人站 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name mochigm.cn www.mochigm.cn;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root  /usr/share/nginx/mochi;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带 hash 的构建产物长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 社交数据与车辆设置由宿主机 node 服务提供
    location /api/ {
        proxy_pass http://10.6.0.5:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- 贼船 Zeichen ----------
server {
    listen 443 ssl;
    http2 on;
    server_name zeichen.mochigm.cn;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_comp_level 6;

    # 附件单文件上限 20MB(backend ATTACHMENT_MAX_FILE_BYTES),留余量
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP streamable HTTP:POST 响应走 SSE,必须逐块转发。
    # Host 必须带端口(MCP 的 DNS-rebinding 白名单按 host:port 模式匹配)
    location /mcp {
        proxy_pass http://mcp:8000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # MCP OAuth 元数据端点(RFC 9728)
    location /.well-known/ {
        proxy_pass http://mcp:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- 兜底:未知 Host 的 HTTPS 直接断连 ----------
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    return 444;
}
