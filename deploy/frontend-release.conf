server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
